# Base kustomization for the platform CRDs.
#
# Exists so out-of-repo overlays (e.g. the private AWS deploy in spawnly-infra)
# can consume this directory as a kustomize base. spawnly-infra vendors this
# directory locally via its deploy/aws/sync-bases.sh (pinned to a recorded
# source commit rather than consumed as a remote base). Resources are listed by relative path
# (no parent-escaping) so the base builds without needing LoadRestrictionsNone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - agentworkload.yaml
