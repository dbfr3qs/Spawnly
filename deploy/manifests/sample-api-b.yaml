apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api-b
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-api-b
  template:
    metadata:
      labels:
        app: sample-api-b
    spec:
      containers:
        - name: sample-api
          image: agent-sample-api:latest
          imagePullPolicy: Never
          env:
            - name: API_AUDIENCE
              value: "sample-api-b"
            - name: SPICEDB_ENDPOINT
              value: "spicedb:50051"
            - name: SPICEDB_PSK
              value: "poc-secret"
            - name: IS_ISSUER
              value: "http://identity-server:8080"
            - name: IS_JWKS_URL
              value: "http://identity-server:8080/.well-known/openid-configuration/jwks"
            # MIGRATION-TEMPORARY (Keycloak cutover, removed in Phase 6): also
            # accept Keycloak-minted agent tokens (the attestation SPI path,
            # exercised by keycloak-probe). KC_ISSUER is the FIXED frontend
            # origin Keycloak stamps on every token (KC_HOSTNAME); KC_JWKS_URL
            # is the in-cluster backchannel host. Mirror orchestrator.yaml.
            - name: KC_ISSUER
              value: "http://localhost:8090/realms/spawnly"
            - name: KC_JWKS_URL
              value: "http://keycloak:8080/realms/spawnly/protocol/openid-connect/certs"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api-b
  namespace: default
spec:
  selector:
    app: sample-api-b
  ports:
    - port: 8080
      targetPort: 8080
