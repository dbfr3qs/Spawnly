apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api-b
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-api-b
  template:
    metadata:
      labels:
        app: sample-api-b
    spec:
      containers:
        - name: sample-api
          image: agent-sample-api:latest
          imagePullPolicy: Never
          env:
            - name: API_AUDIENCE
              value: "sample-api-b"
            - name: SPICEDB_ENDPOINT
              value: "spicedb:50051"
            - name: SPICEDB_PSK
              value: "poc-secret"
            # Keycloak issuer + JWKS. IS_ISSUER is the FIXED frontend origin
            # Keycloak stamps on every token (KC_HOSTNAME); IS_JWKS_URL is the
            # in-cluster backchannel host (KC_HOSTNAME_BACKCHANNEL_DYNAMIC).
            - name: IS_ISSUER
              value: "http://localhost:8090/realms/spawnly"
            - name: IS_JWKS_URL
              value: "http://keycloak:8080/realms/spawnly/protocol/openid-connect/certs"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api-b
  namespace: default
spec:
  selector:
    app: sample-api-b
  ports:
    - port: 8080
      targetPort: 8080
