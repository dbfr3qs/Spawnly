apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: agent-orchestrator
      containers:
        - name: orchestrator
          image: agent-orchestrator:latest
          imagePullPolicy: Never
          env:
            - name: SPICEDB_ENDPOINT
              value: "spicedb:50051"
            - name: SPICEDB_PSK
              value: "poc-secret"
            - name: REGISTRY_URL
              value: "http://registry:8080"
            # Keycloak issuer + JWKS for validating agent spawn tokens
            # (buildSpawnValidator). IS_ISSUER is the FIXED frontend origin
            # Keycloak stamps on every token (KC_HOSTNAME); IS_JWKS_URL is the
            # in-cluster backchannel host (KC_HOSTNAME_BACKCHANNEL_DYNAMIC) the
            # orchestrator fetches keys from. The issuer the token carries
            # (localhost:8090) differs from where we fetch keys (keycloak:8080),
            # so the two URLs are intentionally different hosts.
            - name: IS_ISSUER
              value: "http://localhost:8090/realms/spawnly"
            - name: IS_JWKS_URL
              value: "http://keycloak:8080/realms/spawnly/protocol/openid-connect/certs"
            # Control-plane auth the orchestrator presents to the registry's
            # template + consent endpoints; must match the registry's setting.
            # (NOT used for dashboard→orchestrator spawn auth — that now uses
            # the human's delegated OAuth access token, validated by the same
            # IS_ISSUER/IS_JWKS_URL validator.) Both values come from the
            # optional `control-plane-auth` Secret that bootstrap.sh generates
            # (shared with the registry, so the tokens match by construction).
            # Absent Secret → env unset → "none" (sends no credential, demo).
            # For "oidc" instead, drop the secretKeyRefs, set
            # CONTROL_PLANE_AUTH=oidc, and uncomment the client-credentials
            # block (the "orchestrator" IdP client).
            - name: CONTROL_PLANE_AUTH
              valueFrom:
                secretKeyRef:
                  name: control-plane-auth
                  key: auth
                  optional: true
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: control-plane-auth
                  key: token
                  optional: true
            # --- oidc tier ---
            # - name: CONTROL_PLANE_TOKEN_URL
            #   value: "http://keycloak:8080/realms/spawnly/protocol/openid-connect/token"
            # - name: CONTROL_PLANE_CLIENT_ID
            #   value: "orchestrator"
            # - name: CONTROL_PLANE_CLIENT_SECRET
            #   value: "orchestrator-secret"
            # - name: CONTROL_PLANE_SCOPE
            #   value: "registry.consent"
            # --- remote-substrate (Phase 3) ---
            # SPIRE trust domain the substrate connect/Entry API pin (must match
            # deploy/spire/values.yaml). Default is cluster.local when unset.
            - name: SPIRE_TRUST_DOMAIN
              value: "cluster.local"
            # The bundle namespace + service account the substrate-agent bootstrap
            # entry binds to (deploy/substrate).
            - name: SUBSTRATE_AGENT_NAMESPACE
              value: "substrate-sim"
            - name: SUBSTRATE_AGENT_SA
              value: "substrate-agent"
            # Substrate CONNECT (org-bound x509 issuance) is enabled ONLY when the
            # dev CA is mounted below. Absent ⇒ POST /v1/orgs/{id}/substrate returns
            # 503 (never insecure). The dev CA is generated at bootstrap into a
            # Secret (scripts/substrate-ca.sh) — NEVER committed or baked into an
            # image. This is the LOCAL-SIM stub; the real Spawnly CA is the
            # spawnly-infra track.
            - name: SUBSTRATE_CA_CERT_FILE
              value: "/run/substrate-ca/ca.crt"
            - name: SUBSTRATE_CA_KEY_FILE
              value: "/run/substrate-ca/ca.key"
            # The CP-mediated Entry API + substrate-agent bootstrap-entry
            # provisioning need a delegated-admin path to the SPIRE server's entry
            # API. Wiring the live socket (and the server-side admin_ids trust — see
            # deploy/spire/values.yaml) lands with the dispatch channel (Phase 4);
            # until SPIRE_SERVER_SOCKET is set the Entry API returns 503 and connect
            # defers the bootstrap entry to the Phase-4 reconcile.
            # - name: SPIRE_SERVER_SOCKET
            #   value: "/run/spire-server/private/api.sock"
            # - name: SPIRE_JWKS_URL
            #   value: "http://spire-spiffe-oidc-discovery-provider.spire-system/keys"
          ports:
            - containerPort: 8080
          volumeMounts:
            # Dev CA for substrate identity issuance (see SUBSTRATE_CA_*_FILE). The
            # Secret is optional: without it the volume is empty and connect stays
            # disabled (503).
            - name: substrate-ca
              mountPath: /run/substrate-ca
              readOnly: true
      volumes:
        - name: substrate-ca
          secret:
            secretName: substrate-dev-ca
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: default
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8080
      targetPort: 8080
