apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: agent-dashboard:latest
          imagePullPolicy: Never
          env:
            - name: ORCHESTRATOR_URL
              value: "http://orchestrator:8080"
            # OIDC relying-party config. OIDC_AUTHORITY is the browser-facing
            # origin; IDENTITY_INTERNAL_URL is the in-cluster back-channel to the
            # Keycloak realm issuer (also the token issuer the resource servers
            # validate). The dashboard reverse-proxies Keycloak's browser-facing
            # /realms/ and /resources/ paths so the browser stays single-origin.
            - name: OIDC_AUTHORITY
              value: "http://localhost:8090"
            - name: IDENTITY_INTERNAL_URL
              value: "http://keycloak:8080/realms/spawnly"
            - name: OIDC_CLIENT_ID
              value: "dashboard"
            - name: OIDC_CLIENT_SECRET
              value: "dashboard-secret"
            # Header "Docs" link target. Local dev runs the docs site on :4321;
            # the AWS deploy.sh overrides this to the public docs origin.
            - name: DOCS_URL
              value: "http://localhost:4321"
            # Host-aware org subdomains (org-subdomains feature). APEX_DOMAIN empty
            # = single-origin mode: every Host resolves to the apex, preserving
            # today's localhost:8090 behavior. Set to the apex (spawnly.run /
            # localtest.me) to enable <slug>.<apex> per-org routing; the AWS
            # deploy.sh sets APEX_DOMAIN=spawnly.run. TRUST_FORWARDED_HOST stays
            # OFF: the ALB preserves the browser's original Host, so the dashboard
            # reads r.Host directly (the unforgeable routing signal). Only set it
            # true behind a proxy that rewrites Host into X-Forwarded-Host.
            - name: APEX_DOMAIN
              value: ""
            - name: TRUST_FORWARDED_HOST
              value: ""
            # Platform master-admin username — surfaced on /api/me so the admin
            # Users directory hides destructive actions on that account's row,
            # matching the registry root lockout guard (same env, default "root").
            # Keep in sync with the registry's MASTER_ADMIN_USERNAME.
            - name: MASTER_ADMIN_USERNAME
              value: "root"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: default
spec:
  selector:
    app: dashboard
  ports:
    - port: 8080
      targetPort: 8080
