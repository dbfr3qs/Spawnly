apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          # Optimized custom image (root Dockerfile `keycloak` target): the base
          # is pinned by digest and `kc.sh build` is baked in, so the container
          # starts with `start --optimized`.
          image: agent-keycloak:latest
          imagePullPolicy: Never
          args: ["start", "--optimized"]
          env:
            # Bootstrap admin — created on first start of an empty DB. Comes from
            # the `keycloak-admin` Secret that bootstrap.sh generates (never a
            # baked-in default), mirroring how identityserver keeps its secrets
            # out of the image. On kind the store is the in-memory dev-file DB, so
            # the admin is re-bootstrapped on every restart from this Secret.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            # Plain HTTP inside the cluster (TLS is terminated at the edge, like
            # identity-server's ASPNETCORE_URLS http listener).
            - name: KC_HTTP_ENABLED
              value: "true"
            # FIXED frontend hostname + DYNAMIC backchannel — the correct
            # Keycloak-behind-a-proxy model. In 26.x the token ISSUER is tied to
            # the FRONTEND hostname and is stamped from the request that created
            # the auth session — i.e. the BROWSER's request (arriving via the
            # dashboard proxy), NOT the backchannel token-exchange call. So a
            # dynamic hostname makes browser-flow tokens carry the dashboard
            # origin while backchannel (agent) tokens carry keycloak:8080 — a
            # SPLIT issuer that breaks id_token verification and the resource
            # servers. Instead we PIN the frontend hostname (⇒ issuer +
            # login-form action + asset URLs) to the dashboard origin, which the
            # browser reaches through the single-origin proxy, and let BACKCHANNEL
            # endpoints (token/JWKS/introspection) resolve dynamically from the
            # request Host so in-cluster callers still hit keycloak:8080 directly.
            #   - issuer (ALL tokens, browser + backchannel) =
            #     http://localhost:8090/realms/spawnly — the single value every
            #     resource server + the dual-issuer tokenvalidator shim validate;
            #   - token/JWKS endpoints resolve to keycloak:8080 for in-cluster
            #     backchannel callers (dashboard, resource servers).
            # NOTE (Phase 7, public/ALB deploy): KC_HOSTNAME becomes the public
            # https origin (e.g. https://spawnly.run) with the same backchannel-
            # dynamic setting; the issuer is then https://spawnly.run/realms/spawnly.
            - name: KC_HOSTNAME
              value: "http://localhost:8090"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            # Reverse-proxy header trust. Gated exactly like identity-server's
            # FORWARDED_HEADERS: OFF on kind (the dashboard talks to Keycloak by
            # its cluster IP, no forwarding), set to "xforwarded" behind the AWS
            # ALB so Keycloak trusts X-Forwarded-* for scheme/host. Absent Secret
            # → env unset → Keycloak's default (no proxy header trust).
            - name: KC_PROXY_HEADERS
              valueFrom:
                secretKeyRef:
                  name: keycloak-proxy
                  key: proxyHeaders
                  optional: true
            # ── Attestation (Phase 1) ──────────────────────────────────────
            # The custom "spawnly-attestation" client authenticator reads these
            # exactly as identity-server does. ATTESTOR selects the credential
            # verifier behind the seam (spiffe default; aws-sts/aws-stsweb in
            # Phase 5; unknown = hard fail at startup). SPIRE_JWKS_URL is the
            # SPIRE OIDC discovery provider JWKS (self-signed TLS, trusted
            # in-cluster); mirror identity-server's value.
            - name: ATTESTOR
              value: "spiffe"
            - name: SPIRE_JWKS_URL
              value: "https://spire-spiffe-oidc-discovery-provider.spire-system/keys"
            # ── CIBA spawn-consent (Phase 4) ───────────────────────────────
            # The custom "spawnly-ciba-channel" AuthenticationChannel provider is
            # selected as the realm's CIBA auth channel at BUILD time in the
            # Dockerfile (`kc.sh build --spi-ciba-auth-channel-provider-default=
            # spawnly-ciba-channel`) — it is a build-time SPI option on an
            # optimized image and a runtime env would be rejected. Ours drives
            # consent through the REGISTRY (dashboard/mobile approve/deny) instead
            # of an HTTP channel or Keycloak's built-in consent screen, matching
            # IdentityServer. DEV_CIBA_API is left UNSET on kind: every CIBA
            # request must carry a verified SVID (the edge is bound from the SVID,
            # never from request params).
            # ── Registry-driven identity (Phase 2) ─────────────────────────
            # The attestation authenticator's liveness gate + the identity
            # mapper look agents up in the registry (status active, userId,
            # agentType==client_id) via AgentRegistryClient. Same value +
            # control-plane auth the identity-server manifest uses, so the two
            # IdPs behave identically against the registry.
            - name: REGISTRY_URL
              value: "http://registry:8080"
            # Control-plane auth the IdP presents to the registry (must match
            # the registry's setting). Both values come from the optional
            # `control-plane-auth` Secret bootstrap.sh generates (shared with
            # the registry, so tokens match by construction). Absent Secret →
            # env unset → "none" (no credential; the registry runs open on
            # kind). For "oidc": drop the secretKeyRefs, set
            # CONTROL_PLANE_AUTH=oidc, and uncomment the client-credentials
            # block below (the "idp-consent" client).
            - name: CONTROL_PLANE_AUTH
              valueFrom:
                secretKeyRef:
                  name: control-plane-auth
                  key: auth
                  optional: true
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: control-plane-auth
                  key: token
                  optional: true
            # --- oidc tier (mirror identity-server) ---
            # - name: CONTROL_PLANE_TOKEN_URL
            #   value: "http://keycloak:8080/realms/spawnly/protocol/openid-connect/token"
            # - name: CONTROL_PLANE_CLIENT_ID
            #   value: "idp-consent"
            # - name: CONTROL_PLANE_CLIENT_SECRET
            #   value: "idp-consent-secret"
            # - name: CONTROL_PLANE_SCOPE
            #   value: "registry.consent"
            # DEBUG-level logging for the Spawnly SPI providers so attestation
            # verification failures (bad signature, JWKS fetch, expiry) surface
            # in the pod log. Root stays INFO. Harmless to keep on kind.
            - name: KC_LOG_LEVEL
              value: "INFO,run.spawnly:debug"
            # NOTE: health is enabled at BUILD time in the Dockerfile
            # (`kc.sh build --health-enabled=true`) — on an optimized image a
            # runtime KC_HEALTH_ENABLED would be ignored — so the /health/ready
            # probe below works with no extra runtime env.
          ports:
            - containerPort: 8080
          # Keycloak's own liveness/readiness endpoints are served on the
          # management port 9000 (26.x). Gate readiness on /health/ready so the
          # bootstrap rollout wait doesn't proceed before the realm can be
          # applied.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: default
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
