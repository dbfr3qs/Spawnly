apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      # Dedicated SA (mirrors agent-operator/agent-orchestrator). It carries no
      # RBAC — the registry never touches the k8s API — it exists so the AWS
      # deploy can bind a least-privilege IAM role to it via an EKS Pod Identity
      # association (Phase 5, DynamoDB access for STORE=dynamodb). Harmless on
      # kind: the SA is created and the pod simply runs under it.
      serviceAccountName: registry
      containers:
        - name: registry
          image: agent-registry:latest
          imagePullPolicy: Never
          env:
            - name: SPICEDB_ENDPOINT
              value: "spicedb:50051"
            - name: SPICEDB_PSK
              value: "poc-secret"
            - name: SPIRE_JWKS_URL
              value: "https://spire-spiffe-oidc-discovery-provider.spire-system/keys"
            # When a consent request goes pending the registry POSTs a
            # notification here (best-effort). The mobile-gateway fans it out to
            # the user's registered devices and SSE streams. It presents the
            # control-plane shared secret on this hop, which the gateway verifies.
            - name: NOTIFIER_WEBHOOK_URL
              value: "http://mobile-gateway:8081/internal/notify"
            # Control-plane auth for the template + consent-lifecycle endpoints.
            # Both values come from the optional `control-plane-auth` Secret,
            # which bootstrap.sh generates (auth=shared-secret + a random token).
            # When the Secret is absent (a raw `kubectl apply` with no bootstrap)
            # the env is unset and the registry falls back to "none" — open, for
            # the demo. For "oidc" instead, drop the secretKeyRefs, set
            # CONTROL_PLANE_AUTH=oidc, and uncomment the JWKS/audience/scope below.
            - name: CONTROL_PLANE_AUTH
              valueFrom:
                secretKeyRef:
                  name: control-plane-auth
                  key: auth
                  optional: true
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: control-plane-auth
                  key: token
                  optional: true
            # Org directory (multi-tenancy Phase 3): the registry writes Keycloak
            # Organizations/Users through the least-privilege `org-admin`
            # service-account client. The secret comes from the optional
            # `org-admin-auth` Secret (bootstrap.sh generates it + passes the same
            # value to Terraform as the org-admin client secret). When the Secret
            # is absent (a raw apply with no bootstrap) ORG_ADMIN_CLIENT_SECRET is
            # unset and the org endpoints are disabled (they 500) — the platform
            # otherwise runs unchanged.
            - name: KEYCLOAK_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_REALM
              value: "spawnly"
            - name: ORG_ADMIN_CLIENT_ID
              value: "org-admin"
            - name: ORG_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: org-admin-auth
                  key: secret
                  optional: true
            # --- oidc tier ---
            # - name: CONTROL_PLANE_OIDC_JWKS_URL
            #   value: "http://keycloak:8080/realms/spawnly/protocol/openid-connect/certs"
            # - name: CONTROL_PLANE_OIDC_AUDIENCE
            #   value: "registry"
            # - name: CONTROL_PLANE_OIDC_SCOPE
            #   value: "registry.consent"
          ports:
            - containerPort: 8080
          # The registry binds :8080 only AFTER it writes its SpiceDB schema on
          # startup (which retries until SpiceDB is reachable — up to ~30s). Without
          # a probe the pod reports Ready the instant the process starts, so
          # `kubectl rollout status` returns and seeding races a not-yet-listening
          # server (connection refused). A TCP probe on 8080 makes Ready mean
          # "actually serving."
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: default
spec:
  selector:
    app: registry
  ports:
    - port: 8080
      targetPort: 8080
