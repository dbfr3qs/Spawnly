apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-operator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-operator
  template:
    metadata:
      labels:
        app: agent-operator
    spec:
      serviceAccountName: agent-operator
      containers:
        - name: operator
          image: agent-operator:latest
          imagePullPolicy: Never
          env:
            # Scope the platform operator's controller-runtime cache+watch to the
            # `default` namespace — the ONLY namespace platform agents run in
            # (orchestrator hard-codes AgentWorkload namespace `default`, and the
            # stale-sweep's AGENT_NAMESPACE defaults to `default`). Without this
            # the manager watches ALL namespaces and would RACE the substrate
            # operator to reconcile `substrate-sim` AgentWorkloads, building those
            # pods with the WRONG (platform) SPIRE socket and without the substrate
            # SVID-fetch retry budget → the substrate agent never gets its
            # org-scoped SVID. Substrate CRs must be owned solely by the substrate
            # operator (WATCH_NAMESPACE=substrate-sim).
            - name: WATCH_NAMESPACE
              value: "default"
            - name: REGISTRY_URL
              value: "http://registry:8080"
            - name: IS_TOKEN_URL
              value: "http://keycloak:8080/realms/spawnly/protocol/openid-connect/token"
            - name: SAMPLE_API_URL
              value: "http://sample-api-a:8080"
            - name: ORCHESTRATOR_URL
              value: "http://orchestrator:8080"
            # Control-plane auth the operator presents to the registry's
            # PATCH /v1/agents/{id} status endpoint; must match the registry's
            # setting. Both values come from the optional `control-plane-auth`
            # Secret that bootstrap.sh generates (shared with the registry, so
            # the tokens match by construction). Absent Secret → env unset →
            # "none" (sends no credential, demo). The "oidc" tier would need a
            # client-credentials token source (see orchestrator) and is a follow-up.
            - name: CONTROL_PLANE_AUTH
              valueFrom:
                secretKeyRef:
                  name: control-plane-auth
                  key: auth
                  optional: true
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: control-plane-auth
                  key: token
                  optional: true
