# Substrate SPIFFE CSI driver — surfaces the SUBSTRATE agent's workload-API
# socket to substrate-sim pods. It registers under a DISTINCT CSI plugin name
# (csi.substrate.spiffe.io) and socket paths so it coexists with the platform's
# own csi.spiffe.io driver on the same node (single-cluster sim). On a real,
# separate substrate cluster this would just be the stock csi.spiffe.io driver.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: substrate-spiffe-csi-driver
  namespace: substrate-sim
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: substrate-spiffe-csi-driver
  namespace: substrate-sim
  labels:
    app.kubernetes.io/name: substrate-spiffe-csi-driver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: substrate-spiffe-csi-driver
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: substrate-spiffe-csi-driver
    spec:
      serviceAccountName: substrate-spiffe-csi-driver
      containers:
        - name: spiffe-csi-driver
          image: ghcr.io/spiffe/spiffe-csi-driver:0.2.7
          imagePullPolicy: IfNotPresent
          args:
            - "-workload-api-socket-dir"
            - "/spire-agent-socket"
            - "-plugin-name"
            - "csi.substrate.spiffe.io"
            - "-csi-socket-path"
            - "/spiffe-csi/csi.sock"
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: spire-agent-socket-dir
              mountPath: /spire-agent-socket
              readOnly: true
            - name: spiffe-csi-socket-dir
              mountPath: /spiffe-csi
            - name: mountpoint-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.15.0
          imagePullPolicy: IfNotPresent
          args:
            - "-csi-address"
            - "/spiffe-csi/csi.sock"
            - "-kubelet-registration-path"
            - "/var/lib/kubelet/plugins/csi.substrate.spiffe.io/csi.sock"
            - "-health-port"
            - "9819"
          volumeMounts:
            - name: spiffe-csi-socket-dir
              mountPath: /spiffe-csi
            - name: kubelet-plugin-registration-dir
              mountPath: /registration
          ports:
            - containerPort: 9819
              name: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: spire-agent-socket-dir
          hostPath:
            path: /run/spire/substrate-agent-sockets
            type: DirectoryOrCreate
        - name: spiffe-csi-socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.substrate.spiffe.io
            type: DirectoryOrCreate
        - name: mountpoint-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: kubelet-plugin-registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.substrate.spiffe.io
spec:
  attachRequired: false
  podInfoOnMount: true
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Ephemeral
