# Substrate operator — the SAME agent-operator image, watching ONLY the
# substrate-sim namespace (WATCH_NAMESPACE), so it materializes substrate
# AgentWorkloads into local pods without racing the platform operator over
# `default`. Inert in Phase 2 (no AgentWorkloads are created here yet — the
# proof uses a script-created SPIRE entry + a plain test pod); it is wired now so
# the bundle is complete for Phase 4's dispatch path.
#
# NOTE (Phase 4): the reconciler's SpiffeInjector mounts driver csi.spiffe.io.
# For the single-cluster sim, substrate pods must instead mount
# csi.substrate.spiffe.io; making that driver name configurable is a Phase-4
# item. On a real separate substrate cluster csi.spiffe.io is correct as-is.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: substrate-agent-operator
  namespace: substrate-sim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: substrate-agent-operator-role
rules:
  - apiGroups: ["agent-platform.io"]
    resources: ["agentworkloads"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["agent-platform.io"]
    resources: ["agentworkloads/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["agent-platform.io"]
    resources: ["agentworkloads/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: substrate-agent-operator-binding
subjects:
  - kind: ServiceAccount
    name: substrate-agent-operator
    namespace: substrate-sim
roleRef:
  kind: ClusterRole
  name: substrate-agent-operator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-agent-operator
  namespace: substrate-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: substrate-agent-operator
  template:
    metadata:
      labels:
        app: substrate-agent-operator
    spec:
      serviceAccountName: substrate-agent-operator
      containers:
        - name: operator
          image: agent-operator:latest
          imagePullPolicy: Never
          env:
            # Scope the reconciler to the substrate namespace (see cmd/operator).
            - name: WATCH_NAMESPACE
              value: "substrate-sim"
            # Substrate pods get identity from the local SPIRE agent (SPIFFE).
            - name: ATTESTOR
              value: "spiffe"
            # The stale-sweep is a platform-cluster concern; the substrate's
            # liveness is the Phase-4 channel, not a CR sweep.
            - name: STALE_SWEEP
              value: "off"
            - name: AGENT_NAMESPACE
              value: "substrate-sim"
            - name: REGISTRY_URL
              value: "http://registry.default:8080"
            - name: IS_TOKEN_URL
              value: "http://keycloak.default:8080/realms/spawnly/protocol/openid-connect/token"
            - name: ORCHESTRATOR_URL
              value: "http://orchestrator.default:8080"
            - name: CONTROL_PLANE_AUTH
              valueFrom:
                secretKeyRef:
                  name: control-plane-auth
                  key: auth
                  optional: true
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: control-plane-auth
                  key: token
                  optional: true
