# Spawnly login-theme message overrides. A child theme's message bundle is
# MERGED onto the parent chain (keycloak.v2 -> base), so these keys are added on
# top of Keycloak's stock messages without replacing them.
#
# spawnlySignupsAtCapacity: shown on the register page when the spawnly-user-cap
# registration form action rejects a signup because the realm has reached the
# MAX_USERS ceiling (signup-lifecycle Phase 2). Kept ASCII (no em dash) so it is
# encoding-safe across the properties loader.
spawnlySignupsAtCapacity=Signups are currently at capacity. Please try again later.
