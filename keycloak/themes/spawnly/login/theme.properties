# Spawnly login theme — a CSS-only reskin of Keycloak's stock keycloak.v2
# login theme so the OIDC login hop matches the dashboard's dark-purple UI.
# No .ftl template overrides: Keycloak's markup, element IDs (#username,
# #password, #kc-login) and flow behaviour stay intact (the e2e suite and
# future Keycloak upgrades depend on them).
parent=keycloak.v2

# A child theme's `styles` REPLACES the parent's list (it does not append), so
# we re-list keycloak.v2's own css/styles.css FIRST to keep its PatternFly
# layout, then layer our palette on top with css/spawnly.css. Resource lookup
# falls back through the parent chain, so css/styles.css resolves from
# keycloak.v2 even though this theme ships only css/spawnly.css.
styles=css/styles.css css/spawnly.css
