name: ci

# Lane 1 — fast, secret-free build + unit-test gate for every PR.
#
# Deliberately does NOT spin up Kind/SPIRE or run the e2e suite: those need a
# real AI key and cost money/time, so they live in a separate gated lane. This
# workflow only compiles every toolchain and runs the unit tests, so it is safe
# to run on fork PRs (no secrets are referenced).
#
# Not duplicated here (already covered elsewhere):
#   - terraform-provider-spawnly  -> .github/workflows/terraform-provider.yml

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

# Cancel superseded runs on the same ref so a new push doesn't queue behind a
# stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # setup-go caches the module + build cache keyed on go.sum by default.
          cache-dependency-path: |
            go.sum
            sdks/go/go.sum

      # Root module: compile everything, then the 185-file unit suite (== make test).
      - name: go build (root module)
        run: go build ./...
      - name: go vet (root module)
        run: go vet ./...
      - name: make test (root unit tests)
        run: make test

      # DynamoDB Store/DeviceStore conformance suites against dynamodb-local.
      # dynamodb-local needs no secrets (dummy creds satisfy the SDK signer), so
      # this stays in the fork-safe lane 1. `make test-dynamodb` owns the
      # container lifecycle (start, wait, run the DYNAMODB_TEST_ENDPOINT-gated
      # tests, tear down).
      - name: make test-dynamodb (dynamodb-local)
        run: make test-dynamodb

      # go.work lists two modules; `go test ./...` only covers the module in
      # cwd, so the other one is built/tested explicitly.
      - name: go test (sdks/go)
        run: go test ./... -count=1
        working-directory: sdks/go

  node:
    name: node typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - chain-worker
          - weather-monitor
          - travel-specialist
          - travel-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The agents depend on @spawnly/sdk via `file:../../sdks/typescript`, so the
      # SDK must be built (dist/) before any agent can typecheck against it.
      - name: build @spawnly/sdk
        run: npm ci && npm run build
        working-directory: sdks/typescript

      # `npm run build` is `tsc` for every agent except weather-monitor, whose
      # build is `flue build --target node` — running the real build path on each
      # mirrors what `make reload-<agent>` does locally.
      - name: build ${{ matrix.agent }}
        run: npm ci && npm run build
        working-directory: agents/${{ matrix.agent }}

  java:
    name: keycloak providers build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: keycloak/providers/pom.xml
      # Compile the custom Keycloak SPI providers + run the JUnit suite
      # (SPIFFE verifier, ATTESTOR selector, attestation client authenticator).
      - name: mvn verify (keycloak/providers)
        run: mvn -B -e verify
        working-directory: keycloak/providers

  manifests:
    name: validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version PINNED: installing `latest` broke when v0.8.0 started treating a
      # failed schema download as a hard error instead of a missing schema, so
      # kinds absent from the strict schema catalog went from silently skipped
      # (-ignore-missing-schemas) to failing the build.
      - name: install kubeconform
        run: |
          curl -sSLf \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      # -ignore-missing-schemas: the CRD-typed AgentWorkload resources have no
      # published schema. -strict catches unknown fields in the core resources.
      # -skip: the strict standalone schema catalog has NO schema for
      # CustomResourceDefinition (a documented kubeconform limitation — CRD
      # schemas can't be expressed in the strict variant) or for Kustomization
      # (kustomization.yaml is kustomize build input, not a cluster resource),
      # so those two kinds are unvalidatable here by construction and must be
      # skipped explicitly rather than relying on 404s being soft errors.
      - name: kubeconform deploy/
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.31.0 \
            -skip CustomResourceDefinition,Kustomization \
            deploy/crds/ deploy/manifests/
